name: Build Linux

on:
    push:
        # branches: [ "master" ]
    pull_request:
        branches: ["master"]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/2.3.x-lts' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 180

        permissions:
            packages: write

        steps:
            - uses: actions/checkout@v7

            - name: Run build
              run: |
                  ./tools/linux/build-in-docker
              env:
                  CI: 1
